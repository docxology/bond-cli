# bond-cli — PROJECT BOND front door (THE FRONT DOOR)
# Layer 4 · unified terminal CLI over the orchestrator/coordinator.
# Depends on the four built layers (path sources): bond-api (protocol),
# bond-coordinator (registry/status), bond-orchestrator (missions/runner),
# bond-utilities (Q-branch). numpy + pyyaml for loading film providers.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bond-cli"
version = "3.0.0"
license = "MIT"
description = "PROJECT BOND unified terminal front door: brief/recon/plan/execute/debrief films, run multi-package missions, suite status, gadgets."
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.10"
dependencies = [
    "bond-api",
    "bond-coordinator",
    "bond-orchestrator",
    "bond-utilities",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
bond = "bond_cli.dispatch:main"

# Built sibling layers resolved from the local BOND workspace (never published).
[tool.uv.sources]
bond-api = { path = "../bond-api" }
bond-coordinator = { path = "../bond-coordinator" }
bond-orchestrator = { path = "../bond-orchestrator" }
bond-utilities = { path = "../bond-utilities" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
files = ["src/**/*.py"]

# The four layers ship without py.typed; consume them as untyped third-party.
[[tool.mypy.overrides]]
module = [
    "bond_api.*",
    "bond_coordinator.*",
    "bond_orchestrator.*",
    "bond_utilities.*",
]
ignore_missing_imports = true

[tool.ruff.lint]
# Self-contained rule set so the monorepo root's config cannot leak in.
# TRY004: the suite deliberately raises ValueError with actionable messages.
# RUF001-3: ambiguous-unicode conflicts with legitimate typography (en dashes).
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "PLW", "PERF", "RUF"]
ignore = ["TRY004", "RUF001", "RUF002", "RUF003"]
