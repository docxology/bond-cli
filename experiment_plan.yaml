# Advisory experiment plan for bond-cli (advisory only; no autonomous execution).
commands:
  - name: list
    delegate: bond_coordinator.registry
    expected: "27 film rows (rank, slug, title, year, codename)"
  - name: brief/recon/plan/execute/debrief
    delegate: bond_api discovery + provider
    expected: "one protocol stage of a real film provider"
  - name: run
    delegate: bond_orchestrator runner
    expected: "consolidated debrief; exit 0 iff all verdicts pass"
  - name: status
    delegate: bond_coordinator.status
    expected: "suite snapshot (counts, coverage, blocked)"
  - name: gadgets
    delegate: bond_api.registry.GadgetRegistry
    expected: "gadget payload names per film"
exit_codes:
  success: 0
  command_failure: 1
  argparse_misuse: 2
